    @keyframes fadeIn {

    @media (max-width: 480px) {

    /* VIDEO BACKGROUND STYLES */

 .video-background iframe {

    /* Style the image to look clickable */

/* COUNTDOWN CUSTOM STYLES */

  <!-- TALLY EMBED SCRIPT -->
  <script async src="https://tally.so/widgets/embed.js"></script>

  <!-- ================= FUNCTIONALITY SCRIPT ================= -->
  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzUDyZaDCa9DX4pmfQ-yxsfHGdKs761b1E8jeagSrxEcYwWJMD3mwNGTw3-phEztO/exec';

    // 1. AUTOPLAY AUDIO & VIDEO ON FIRST CLICK
    document.addEventListener('click', function() {
      var audio = document.getElementById('bg-audio');
      if (audio && audio.paused) {
        audio.play().catch(function(error) {
          console.log("Audio autoplay failed/blocked: ", error);
        });
      }
      var iframe = document.querySelector('.video-background iframe');
      if (iframe && iframe.contentWindow) {
        iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
      }
    }, { once: true });

    // 2. OPEN INVITATION BUTTON
    function bukaUndangan() {
      document.documentElement.style.overflow = 'auto';
      document.body.style.overflow = 'auto';

      setTimeout(function() {
        const bridgeSection = document.getElementById('bridge');
        if (bridgeSection) {
          bridgeSection.scrollIntoView({ behavior: 'smooth' });
        }
      }, 50);
    }

    // 3. TALLY POPUP & POSITION RESTORE
    function bukaTallyPopup() {
      if (typeof Tally !== 'undefined') {
        Tally.openPopup('lbx9gX', {
          layout: 'modal',
          width: 800,
          hideTitle: true,
          overlay: true,
          emoji: {
            text: '🌸',
            animation: 'spin'
          },
          onClose: kembalikanKeRSVP
        });
      }
    }

    function kembalikanKeRSVP() {
      const rsvpEl = document.getElementById('rsvp-section');
      if (rsvpEl) {
        rsvpEl.scrollIntoView({ behavior: 'instant' });
      }
    }

    window.addEventListener('message', function(e) {
      if (e.data && typeof e.data === 'string' && e.data.includes('Tally.PopupClosed')) {
        kembalikanKeRSVP();
      }
    });

  // 4. GIFT BUTTON TOGGLE
      document.addEventListener('DOMContentLoaded', () => {
        const giftBtn = document.getElementById('giftBtn');
        const hiddenGift = document.getElementById('hidden-gift'); // Sudah diisi 'hidden-gift'
  
        if (giftBtn && hiddenGift) {
          giftBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            hiddenGift.classList.toggle('show');
          });
        }
      });

    // 5. GET GUEST NAME FROM URL PARAMS (?to=Nama atau ?name=Nama)
    function getGuestName() {
  const urlParams = new URLSearchParams(window.location.search);
  const guest = urlParams.get('to') || urlParams.get('name') || 'Guest';
  const decodedGuest = decodeURIComponent(guest);

  // div
  const guestContainer = document.getElementById('guestName');
  if (guestContainer) {
    guestContainer.innerText = decodedGuest;
  }
  
  // OG 
  const ogTitle = document.querySelector('meta[property="og:title"]');
  if (ogTitle) {
    ogTitle.setAttribute('content', `Dear ${decodedGuest}, you're invited to our wedding`);
  }
  document.title = `Dear ${decodedGuest}, you're invited to our wedding`;
}


    // 6. FETCH WISHES FROM GOOGLE APPS SCRIPT
    function loadWishes() {
      const container = document.getElementById('wishesContainer');
      
      fetch('https://script.google.com/macros/s/AKfycbxBDe1iPGhyuco5RpYna6tvjIk-H9AInWfWS4ne7BCBy0-TgGjePANXBJrQAMNkb0UCog/exec')
        .then(response => response.json())
        .then(data => {
          if (!container) return;
          container.innerHTML = '';

          if (!data || data.length === 0) {
            container.innerHTML = '<div class="empty-state">No wishes yet. Be the first to leave one ♡</div>';
            return;
          }

          data.forEach(function(item) {
            const card = document.createElement('div');
            card.className = 'wish-card';

            const name = document.createElement('div');
            name.className = 'guest-title-name';
            name.textContent = item.name;

            const wish = document.createElement('div');
            wish.className = 'guest-wish';
            wish.textContent = item.wish;

            card.appendChild(name);
            card.appendChild(wish);
            container.appendChild(card);
          });
        })
        .catch(err => {
          console.error('Error loading wishes:', err);
          if (container && !container.querySelector('.wish-card')) {
            container.innerHTML = '<div class="error">Loading wishes....</div>';
          }
        });
    }

    // INITIALIZE AFTER DOM LOADED
    document.addEventListener('DOMContentLoaded', () => {
      getGuestName();
      loadWishes();
      
      // Auto refresh ucapan setiap 30 detik
      setInterval(loadWishes, 30000);
    });


// COUNTDOWN TIMER SCRIPT
const targetDate = new Date("October 25, 2026 00:00:00").getTime();

function updateCountdown() {
  const now = new Date().getTime();
  const difference = targetDate - now;

  if (difference > 0) {
    const days = Math.floor(difference / (1000 * 60 * 60 * 24));
    const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((difference % (1000 * 60)) / 1000);

    document.getElementById("cd-days").innerText = String(days).padStart(2, '0');
    document.getElementById("cd-hours").innerText = String(hours).padStart(2, '0');
    document.getElementById("cd-mins").innerText = String(minutes).padStart(2, '0');
    document.getElementById("cd-secs").innerText = String(seconds).padStart(2, '0');
  }
}

// Jalankan saat pertama kali & update setiap detik
updateCountdown();
setInterval(updateCountdown, 1000);


    
  </script>
